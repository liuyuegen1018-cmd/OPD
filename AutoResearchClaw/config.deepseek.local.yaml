project:
  name: "autoresearch-deepseek"
  mode: "full-auto"

research:
  topic: "Your research topic here"
  domains:
    - "machine-learning"
  daily_paper_count: 10
  quality_threshold: 4.0

runtime:
  timezone: "Asia/Shanghai"
  max_parallel_tasks: 3
  approval_timeout_hours: 12
  retry_limit: 2

notifications:
  channel: "console"
  target: ""
  on_stage_start: true
  on_stage_fail: true
  on_gate_required: true

knowledge_base:
  backend: "markdown"
  root: "docs/kb"

openclaw_bridge:
  use_cron: false
  use_message: false
  use_memory: false
  use_sessions_spawn: false
  use_web_fetch: false
  use_browser: false

llm:
  provider: "openai-compatible"
  base_url: "http://172.16.151.6:30000/v1"
  wire_api: "chat_completions"
  api_key_env: "DEEPSEEK_API_KEY"
  api_key: "EMPTY"
  primary_model: "deepseek-v4-pro"
  fallback_models: []
  timeout_sec: 600

security:
  hitl_required_stages: []
  allow_publish_without_approval: true
  redact_sensitive_logs: true

experiment:
  mode: "sandbox"
  time_budget_sec: 300
  max_iterations: 5
  metric_key: "macro_f1"
  metric_direction: "maximize"
  sandbox:
    python_path: ".venv/bin/python"
    gpu_required: false
    max_memory_mb: 4096
  opencode:
    enabled: false

prompts:
  custom_file: ""

metaclaw_bridge:
  enabled: false
