project:
  name: "metrics-contract-smoke"
  mode: "full-auto"

research:
  topic: "面向科研论文摘要分类的 TF-IDF 特征与轻量级机器学习模型对比研究"
  domains: ["machine-learning"]
  daily_paper_count: 1
  quality_threshold: 1.0

runtime:
  timezone: "Asia/Shanghai"
  max_parallel_tasks: 1
  approval_timeout_hours: 1
  retry_limit: 1

notifications:
  channel: "console"
  target: ""
  on_stage_start: false
  on_stage_fail: true
  on_gate_required: false

knowledge_base:
  backend: "markdown"
  root: "docs/kb"

llm:
  provider: "openai-compatible"
  base_url: "http://172.16.151.31:8022/v1"
  wire_api: "chat_completions"
  api_key_env: "GLM_API_KEY"
  api_key: "EMPTY"
  primary_model: "glm-5"
  fallback_models: []
  timeout_sec: 120

security:
  hitl_required_stages: []
  allow_publish_without_approval: true
  redact_sensitive_logs: false

experiment:
  mode: "sandbox"
  time_budget_sec: 30
  max_iterations: 1
  metric_key: "macro_f1"
  metric_direction: "maximize"
  sandbox:
    python_path: ".venv/bin/python"
    gpu_required: false
    max_memory_mb: 1024

prompts:
  custom_file: ""
